<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img"
     aria-labelledby="title description">
  <title id="title">AEAD 是带防拆封条的加密信封</title>
  <desc id="description">密钥、明文、nonce 和 AAD 进入 AEAD，输出由 nonce、密文和认证标签组成的信封；解密时上下文不匹配则失败。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 20px; }
  </style>
  <rect width="960" height="500" rx="28" fill="#ffffff"/>

  <text x="55" y="48" class="small">四个输入</text>
  <text x="455" y="48" text-anchor="middle" class="small">一次认证加密</text>
  <text x="785" y="48" text-anchor="middle" class="small">可公开保存的密文信封</text>

  <rect x="45" y="75" width="250" height="72" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="3"/>
  <text x="70" y="108" class="label">Key</text><text x="70" y="135" class="small">必须保密</text>
  <rect x="45" y="165" width="250" height="72" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="70" y="198" class="label">Plaintext</text><text x="70" y="225" class="small">要隐藏的正文</text>
  <rect x="45" y="255" width="250" height="72" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <text x="70" y="288" class="label">Nonce</text><text x="70" y="315" class="small">公开，但同一 key 下不可重复</text>
  <rect x="45" y="345" width="250" height="92" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
  <text x="70" y="378" class="label">AAD</text><text x="70" y="405" class="small">公开，绑定租户、记录、用途和版本</text>

  <path class="arrow" d="M295 111 C340 111 340 185 370 200"/>
  <path class="arrow" d="M295 201 H365"/>
  <path class="arrow" d="M295 291 C340 291 340 245 370 230"/>
  <path class="arrow" d="M295 391 C345 391 350 265 375 245"/>

  <rect x="380" y="145" width="180" height="160" rx="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
  <text x="470" y="205" text-anchor="middle" class="label">AEAD</text>
  <text x="470" y="240" text-anchor="middle" class="small">加密 + 认证</text>
  <text x="470" y="270" text-anchor="middle" class="small">一个接口完成</text>
  <path class="arrow" d="M560 225 H635"/>

  <rect x="650" y="90" width="265" height="255" rx="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
  <rect x="675" y="120" width="215" height="52" rx="14" fill="#fff7ed"/>
  <rect x="675" y="187" width="215" height="72" rx="14" fill="#eff6ff"/>
  <rect x="675" y="274" width="215" height="42" rx="14" fill="#ecfdf5"/>
  <text x="782" y="154" text-anchor="middle" class="label">Nonce</text>
  <text x="782" y="218" text-anchor="middle" class="label">Ciphertext</text>
  <text x="782" y="246" text-anchor="middle" class="small">藏住正文</text>
  <text x="782" y="303" text-anchor="middle" class="label">Tag</text>

  <rect x="375" y="390" width="540" height="76" rx="38" fill="#ecfdf5"/>
  <text x="645" y="421" text-anchor="middle" class="label" fill="#047857">同一个 Key、Nonce、AAD 和密文才能通过验封</text>
  <text x="645" y="451" text-anchor="middle" class="small">任何一项不匹配：返回 FAIL，不释放明文</text>

</svg>
