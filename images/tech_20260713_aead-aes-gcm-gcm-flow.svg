<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 665" role="img"
     aria-labelledby="title description">
  <title id="title">AES-GCM 的 CTR 与 GHASH 双流水线</title>
  <desc id="description">CTR 从 inc32 J0 开始生成密钥流并加密明文；AAD、密文和长度进入 GHASH，再与 AES K J0 结合生成标签。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 20px; }
  </style>
  <rect width="960" height="665" rx="28" fill="#ffffff"/>

  <rect x="35" y="45" width="890" height="245" rx="26" fill="#eff6ff"/>
  <text x="65" y="83" class="label" fill="#1d4ed8">CTR 流水线：藏住正文</text>
  <rect class="node" x="65" y="115" width="150" height="65" rx="18"/>
  <text x="140" y="155" text-anchor="middle" class="label">Nonce</text>
  <path class="arrow" d="M215 148 H275"/>
  <rect class="node" x="285" y="105" width="175" height="85" rx="18"/>
  <text x="372" y="139" text-anchor="middle" class="label">J₀</text>
  <text x="372" y="170" text-anchor="middle" class="small">从 nonce 构造</text>
  <path class="arrow" d="M460 148 H520"/>
  <rect class="node" x="285" y="215" width="175" height="55" rx="18"/>
  <text x="372" y="250" text-anchor="middle" class="label">Key K</text>
  <path class="arrow" d="M460 243 C500 243 495 190 535 175"/>
  <rect class="node" x="520" y="105" width="175" height="85" rx="18"/>
  <text x="607" y="139" text-anchor="middle" class="label">AES 计数器</text>
  <text x="607" y="170" text-anchor="middle" class="small">从 inc32(J₀) 开始</text>
  <path class="arrow" d="M695 148 H730"/>
  <rect x="740" y="105" width="135" height="85" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="807" y="139" text-anchor="middle" class="label">密钥流</text>
  <text x="807" y="170" text-anchor="middle" class="small">KS</text>
  <rect class="node" x="520" y="215" width="175" height="55" rx="18"/>
  <text x="607" y="250" text-anchor="middle" class="label">Plaintext P</text>
  <path class="arrow" d="M695 243 H747"/>
  <path class="arrow" d="M807 190 V207"/>
  <circle cx="807" cy="242" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="807" y="251" text-anchor="middle" class="label">⊕</text>
  <path class="arrow" d="M837 242 H870"/>
  <text x="890" y="250" text-anchor="middle" class="label" fill="#1d4ed8">C</text>

  <rect x="35" y="320" width="890" height="285" rx="26" fill="#f5f3ff"/>
  <text x="65" y="358" class="label" fill="#6d28d9">GHASH 流水线：计算验封依据</text>
  <rect class="node" x="65" y="390" width="190" height="130" rx="20"/>
  <text x="160" y="426" text-anchor="middle" class="label">认证输入</text>
  <text x="160" y="461" text-anchor="middle" class="small">AAD</text>
  <text x="160" y="489" text-anchor="middle" class="small">Ciphertext</text>
  <text x="160" y="517" text-anchor="middle" class="small">二者长度</text>
  <path class="arrow" d="M255 455 H320"/>
  <rect x="330" y="400" width="180" height="110" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/>
  <text x="420" y="445" text-anchor="middle" class="label">GHASH</text>
  <text x="420" y="478" text-anchor="middle" class="small">通用哈希结果 S</text>
  <rect class="node" x="300" y="530" width="220" height="55" rx="18"/>
  <text x="410" y="565" text-anchor="middle" class="label">H = AES_K(0¹²⁸)</text>
  <path class="arrow" d="M410 530 V517"/>
  <path class="arrow" d="M510 455 H595"/>
  <rect class="node" x="565" y="525" width="190" height="55" rx="18"/>
  <text x="660" y="560" text-anchor="middle" class="label">AES_K(J₀)</text>
  <path class="arrow" d="M660 525 V485"/>
  <circle cx="660" cy="455" r="38" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <text x="660" y="465" text-anchor="middle" class="label">⊕</text>
  <path class="arrow" d="M698 455 H780"/>
  <rect x="790" y="410" width="105" height="90" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/>
  <text x="842" y="447" text-anchor="middle" class="label">Tag</text>
  <text x="842" y="478" text-anchor="middle" class="small">验封条</text>
  <text x="480" y="635" text-anchor="middle" class="small">GHASH 不是独立 MAC；它与秘密的 AES_K(J₀) 结合后才形成认证标签</text>

</svg>
