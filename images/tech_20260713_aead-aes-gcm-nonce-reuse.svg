<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" role="img"
     aria-labelledby="title description">
  <title id="title">AES-GCM 重用 nonce 的后果</title>
  <desc id="description">同一密钥与 nonce 会产生相同密钥流，因此两个密文异或等于两个明文异或，同时认证完整性也会被破坏。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 20px; }
  </style>
  <rect width="960" height="525" rx="28" fill="#ffffff"/>

  <rect x="330" y="35" width="300" height="72" rx="36" fill="#fff1f2"/>
  <text x="480" y="79" text-anchor="middle" class="label" fill="#be123c">同一个 Key + Nonce</text>
  <path class="arrow" d="M480 107 V150"/>
  <rect x="355" y="160" width="250" height="70" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
  <text x="480" y="203" text-anchor="middle" class="label">相同密钥流 KS</text>

  <path class="arrow" d="M420 230 C380 255 335 270 295 300"/>
  <path class="arrow" d="M540 230 C580 255 625 270 665 300"/>
  <rect class="node" x="65" y="285" width="210" height="72" rx="20"/>
  <rect class="node" x="685" y="285" width="210" height="72" rx="20"/>
  <text x="170" y="329" text-anchor="middle" class="label">P₁ ⊕ KS</text>
  <text x="790" y="329" text-anchor="middle" class="label">P₂ ⊕ KS</text>
  <path class="arrow" d="M275 321 H350"/><path class="arrow" d="M685 321 H610"/>
  <rect x="365" y="280" width="230" height="82" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="4"/>
  <text x="480" y="315" text-anchor="middle" class="label">得到 C₁、C₂</text>
  <text x="480" y="345" text-anchor="middle" class="small">攻击者可以同时观察</text>

  <rect x="165" y="405" width="630" height="82" rx="28" fill="#fff7ed"/>
  <text x="480" y="443" text-anchor="middle" font-size="30" font-weight="700" fill="#c2410c">C₁ ⊕ C₂ = P₁ ⊕ P₂</text>
  <text x="480" y="474" text-anchor="middle" class="small">明文关系泄露；GCM 的认证能力也会遭到严重破坏</text>

</svg>
