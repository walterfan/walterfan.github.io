<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     aria-labelledby="title description">
  <title id="title">损失函数就是一片山谷，梯度下降就是滚到谷底</title>
  <desc id="description">一条蓝色的碗形损失曲线，横轴是参数值，纵轴是损失。一串小球从左上方损失很大的起点，顺着曲线一步步滚到中间的最低点，也就是误差最小处。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <rect width="960" height="560" rx="28" fill="#ffffff"/>

  <!-- axes -->
  <line x1="130" y1="470" x2="875" y2="470"
        stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="478" x2="130" y2="55"
        stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M862 461 L878 470 L862 479"
        fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M121 68 L130 52 L139 68"
        fill="none" stroke="#334155" stroke-width="4"/>

