  <circle cx="166.5" cy="160.1" r="15" fill="#440154" stroke="#ffffff" stroke-width="3"/><circle cx="231.5" cy="270.7" r="12" fill="#472d7b" stroke="#ffffff" stroke-width="3"/><circle cx="283.7" cy="341.8" r="12" fill="#3b528b" stroke="#ffffff" stroke-width="3"/><circle cx="325.5" cy="387.5" r="12" fill="#2c728e" stroke="#ffffff" stroke-width="3"/><circle cx="359.1" cy="417.0" r="12" fill="#21918c" stroke="#ffffff" stroke-width="3"/><circle cx="386.0" cy="435.9" r="12" fill="#28ae80" stroke="#ffffff" stroke-width="3"/><circle cx="407.6" cy="448.1" r="12" fill="#5ec962" stroke="#ffffff" stroke-width="3"/><circle cx="424.9" cy="455.9" r="12" fill="#addc30" stroke="#ffffff" stroke-width="3"/><circle cx="438.8" cy="460.9" r="15" fill="#fde725" stroke="#ffffff" stroke-width="3"/>

  <!-- start annotation -->
  <text x="186.5" y="146.1" font-size="24"
        font-weight="700" fill="#440154">从这里开始</text>
  <text x="186.5" y="174.1" font-size="20"
        fill="#6b21a8">损失很大</text>

  <!-- minimum annotation -->
  <line x1="495.0" y1="488.0" x2="495.0" y2="466"
        stroke="#059669" stroke-width="2.5" stroke-dasharray="6 6"/>
  <text x="565.0" y="440.0" text-anchor="middle" font-size="24"
        font-weight="700" fill="#059669">目标：最低点</text>
  <text x="565.0" y="466.0" text-anchor="middle" font-size="20"
        fill="#047857">（误差最小）</text>

  <!-- axis labels -->
  <text x="535.0" y="518.0" text-anchor="middle"
        font-size="24" fill="#475569">参数值 θ</text>
  <text x="46" y="270.0" text-anchor="middle" font-size="24"
        fill="#475569" transform="rotate(-90 46 270.0)">损失值 L(θ)</text>

</svg>
