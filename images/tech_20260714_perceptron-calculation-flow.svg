<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img"
     aria-labelledby="title description">
  <title id="title">感知机怎样完成一次判断</title>
  <desc id="description">三个输入分别乘以权重，汇总后加上偏置，再由阶跃函数输出分类结果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .axis { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 21px; }
  </style>
  <rect width="960" height="430" rx="28" fill="#ffffff"/>

  <text x="55" y="48" class="small">输入证据</text>
  <text x="330" y="48" class="small">乘以权重</text>
  <text x="555" y="48" class="small">汇总</text>
  <text x="690" y="48" class="small">激活</text>
  <text x="842" y="48" class="small">输出</text>

  <g>
    <rect class="node" x="40" y="75" width="225" height="68" rx="18" fill="#eff6ff"/>
    <rect class="node" x="40" y="175" width="225" height="68" rx="18" fill="#eff6ff"/>
    <rect class="node" x="40" y="275" width="225" height="68" rx="18" fill="#eff6ff"/>
    <text x="152" y="117" text-anchor="middle" class="label">x₁ · “免费”</text>
    <text x="152" y="217" text-anchor="middle" class="label">x₂ · 可疑链接</text>
    <text x="152" y="317" text-anchor="middle" class="label">x₃ · 通讯录</text>
  </g>
  <g>
    <rect x="325" y="82" width="145" height="54" rx="27" fill="#ede9fe"/>
    <rect x="325" y="182" width="145" height="54" rx="27" fill="#ede9fe"/>
    <rect x="325" y="282" width="145" height="54" rx="27" fill="#ede9fe"/>
    <text x="398" y="117" text-anchor="middle" class="label" fill="#6d28d9">× w₁</text>
    <text x="398" y="217" text-anchor="middle" class="label" fill="#6d28d9">× w₂</text>
    <text x="398" y="317" text-anchor="middle" class="label" fill="#6d28d9">× w₃</text>
  </g>
  <path class="arrow" d="M265 109 H318"/><path class="arrow" d="M265 209 H318"/>
  <path class="arrow" d="M265 309 H318"/>
  <path class="arrow" d="M470 109 C520 109 520 185 550 195"/>
  <path class="arrow" d="M470 209 H545"/>
  <path class="arrow" d="M470 309 C520 309 520 235 550 225"/>
  <circle cx="585" cy="210" r="48" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/>
  <text x="585" y="202" text-anchor="middle" class="label">Σ</text>
  <text x="585" y="230" text-anchor="middle" class="small">+ b</text>
  <path class="arrow" d="M633 210 H680"/>
  <rect x="690" y="163" width="120" height="94" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="4"/>
  <text x="750" y="201" text-anchor="middle" class="label">Step</text>
  <text x="750" y="232" text-anchor="middle" class="small">是否过线</text>
  <path class="arrow" d="M810 210 H850"/>
  <rect x="860" y="163" width="72" height="94" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/>
  <text x="896" y="202" text-anchor="middle" class="label">ŷ</text>
  <text x="896" y="232" text-anchor="middle" class="small">±1</text>
  <text x="480" y="395" text-anchor="middle" font-size="25" font-weight="650" fill="#334155">
    每条证据乘以分值 → 全部相加 → 跨过门槛后给出类别
  </text>

</svg>
