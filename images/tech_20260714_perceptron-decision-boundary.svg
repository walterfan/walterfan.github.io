<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"
     aria-labelledby="title description">
  <title id="title">感知机的线性决策边界</title>
  <desc id="description">垃圾邮件位于右上区域，正常邮件位于左下区域，两类样本由一条负斜率直线分开。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .axis { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 21px; }
  </style>
  <rect width="960" height="600" rx="28" fill="#ffffff"/>

  <polygon points="135,75 840,75 840,505 760,505 135,130" fill="#fff1f2"/>
  <polygon points="135,130 760,505 135,505" fill="#eff6ff"/>
  <line class="axis" x1="135" y1="505" x2="855" y2="505"/>
  <line class="axis" x1="135" y1="518" x2="135" y2="62"/>
  <path d="M837 496 L855 505 L837 514" fill="none" class="axis"/>
  <path d="M126 80 L135 62 L144 80" fill="none" class="axis"/>
  <line x1="135" y1="130" x2="760" y2="505" stroke="#7c3aed" stroke-width="8"
        stroke-linecap="round"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="5">
    <circle cx="220" cy="425" r="16"/><circle cx="300" cy="448" r="16"/>
    <circle cx="385" cy="409" r="16"/><circle cx="478" cy="448" r="16"/>
  </g>
  <g stroke="#e11d48" stroke-width="10" stroke-linecap="round">
    <path d="M435 202 l19 19 m0 -19 l-19 19"/>
    <path d="M553 247 l19 19 m0 -19 l-19 19"/>
    <path d="M655 177 l19 19 m0 -19 l-19 19"/>
    <path d="M735 292 l19 19 m0 -19 l-19 19"/>
  </g>
  <rect x="340" y="278" width="210" height="58" rx="29" fill="#ede9fe"/>
  <text x="445" y="316" text-anchor="middle" font-size="27" font-weight="650" fill="#6d28d9">决策边界</text>
  <text x="650" y="120" text-anchor="middle" font-size="29" font-weight="650" fill="#be123c">垃圾邮件区域</text>
  <text x="310" y="474" text-anchor="middle" font-size="29" font-weight="650" fill="#1d4ed8">正常邮件区域</text>
  <text x="490" y="566" text-anchor="middle" font-size="27" fill="#475569">x₁ · 营销词强度</text>
  <text x="45" y="290" text-anchor="middle" font-size="27" fill="#475569"
        transform="rotate(-90 45 290)">x₂ · 可疑链接强度</text>

</svg>
