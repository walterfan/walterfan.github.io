<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 990" role="img"
     aria-labelledby="title description">
  <title id="title">从人工神经元到大语言模型的演进路线</title>
  <desc id="description">时间线从 1943 年的人工神经元开始，经过感知机、多层网络、深度学习和 Transformer，发展到今天的大语言模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .axis { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 21px; }
  </style>
  <rect width="960" height="990" rx="28" fill="#ffffff"/>
  <line x1="175" y1="70" x2="175" y2="920" stroke="#c4b5fd" stroke-width="8"/>

  <circle cx="175" cy="90" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="6"/>
  <rect x="30" y="60" width="115" height="60" rx="30" fill="#2563eb" opacity="0.12"/>
  <text x="87" y="98" text-anchor="middle" font-size="23" font-weight="700" fill="#2563eb">1943</text>
  <rect x="215" y="45" width="690" height="92" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="250" y="83" class="label" fill="#2563eb">McCulloch-Pitts 神经元</text>
  <text x="250" y="115" class="small">把神经元抽象成逻辑计算单元</text>

  <circle cx="175" cy="220" r="16" fill="#7c3aed" stroke="#ffffff" stroke-width="6"/>
  <rect x="30" y="190" width="115" height="60" rx="30" fill="#7c3aed" opacity="0.12"/>
  <text x="87" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#7c3aed">1958</text>
  <rect x="215" y="175" width="690" height="92" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="250" y="213" class="label" fill="#7c3aed">Rosenblatt 感知机</text>
  <text x="250" y="245" class="small">权重可以从样本中学习</text>

  <circle cx="175" cy="350" r="16" fill="#e11d48" stroke="#ffffff" stroke-width="6"/>
  <rect x="30" y="320" width="115" height="60" rx="30" fill="#e11d48" opacity="0.12"/>
  <text x="87" y="358" text-anchor="middle" font-size="23" font-weight="700" fill="#e11d48">1969</text>
  <rect x="215" y="305" width="690" height="92" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="250" y="343" class="label" fill="#e11d48">单层感知机的局限</text>
  <text x="250" y="375" class="small">XOR 等非线性问题成为醒目的路障</text>

  <circle cx="175" cy="480" r="16" fill="#7c3aed" stroke="#ffffff" stroke-width="6"/>
  <rect x="30" y="450" width="115" height="60" rx="30" fill="#7c3aed" opacity="0.12"/>
  <text x="87" y="488" text-anchor="middle" font-size="23" font-weight="700" fill="#7c3aed">1980s</text>
  <rect x="215" y="435" width="690" height="92" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="250" y="473" class="label" fill="#7c3aed">多层网络与反向传播</text>
  <text x="250" y="505" class="small">隐藏层能够学习内部表示</text>

  <circle cx="175" cy="610" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="6"/>
  <rect x="30" y="580" width="115" height="60" rx="30" fill="#2563eb" opacity="0.12"/>
  <text x="87" y="618" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">1990s–2010s</text>
  <rect x="215" y="565" width="690" height="92" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="250" y="603" class="label" fill="#2563eb">CNN、RNN、表示学习、GPU</text>
  <text x="250" y="635" class="small">架构、数据和计算共同推进深度学习</text>

  <circle cx="175" cy="740" r="16" fill="#f97316" stroke="#ffffff" stroke-width="6"/>
  <rect x="30" y="710" width="115" height="60" rx="30" fill="#f97316" opacity="0.12"/>
  <text x="87" y="748" text-anchor="middle" font-size="23" font-weight="700" fill="#f97316">2017</text>
  <rect x="215" y="695" width="690" height="92" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="250" y="733" class="label" fill="#f97316">Transformer</text>
  <text x="250" y="765" class="small">Attention 让序列训练更易并行</text>

  <circle cx="175" cy="870" r="16" fill="#059669" stroke="#ffffff" stroke-width="6"/>
  <rect x="30" y="840" width="115" height="60" rx="30" fill="#059669" opacity="0.12"/>
  <text x="87" y="878" text-anchor="middle" font-size="23" font-weight="700" fill="#059669">今天</text>
  <rect x="215" y="825" width="690" height="92" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="250" y="863" class="label" fill="#059669">大语言模型 LLM</text>
  <text x="250" y="895" class="small">大规模 Transformer、海量数据与大规模计算</text>

</svg>
