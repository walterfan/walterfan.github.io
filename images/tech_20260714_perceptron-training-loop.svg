<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img"
     aria-labelledby="title description">
  <title id="title">感知机训练循环</title>
  <desc id="description">模型逐条预测并检查答案，答错或压线时更新参数；一轮没有错误时停止训练。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .axis { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 21px; }
  </style>
  <rect width="960" height="390" rx="28" fill="#ffffff"/>

  <rect class="node" x="45" y="70" width="170" height="80" rx="20" fill="#eff6ff"/>
  <rect class="node" x="285" y="70" width="170" height="80" rx="20" fill="#eff6ff"/>
  <rect class="node" x="525" y="70" width="170" height="80" rx="20" fill="#f5f3ff"/>
  <text x="130" y="118" text-anchor="middle" class="label">初始化参数</text>
  <text x="370" y="105" text-anchor="middle" class="label">计算分数</text>
  <text x="370" y="135" text-anchor="middle" class="small">并给出预测</text>
  <text x="610" y="105" text-anchor="middle" class="label">对照答案</text>
  <text x="610" y="135" text-anchor="middle" class="small">检查分类间隔</text>
  <path class="arrow" d="M215 110 H278"/><path class="arrow" d="M455 110 H518"/>

  <polygon points="815,55 920,110 815,165 710,110" fill="#fff7ed" stroke="#f97316" stroke-width="4"/>
  <text x="815" y="103" text-anchor="middle" class="label">错了或</text>
  <text x="815" y="133" text-anchor="middle" class="label">刚好压线？</text>
  <path class="arrow" d="M695 110 H704"/>

  <rect class="node" x="650" y="250" width="235" height="82" rx="20" fill="#fff1f2"/>
  <text x="768" y="283" text-anchor="middle" class="label" fill="#be123c">更新权重与偏置</text>
  <text x="768" y="314" text-anchor="middle" class="small">沿正确方向推一步</text>
  <path class="arrow" d="M815 165 V242"/>
  <text x="835" y="213" class="small" fill="#be123c">是</text>

  <rect class="node" x="315" y="250" width="235" height="82" rx="20" fill="#ecfdf5"/>
  <text x="432" y="283" text-anchor="middle" class="label" fill="#047857">继续下一条样本</text>
  <text x="432" y="314" text-anchor="middle" class="small">或开始下一轮</text>
  <path class="arrow" d="M710 110 C670 110 650 200 550 270"/>
  <text x="642" y="172" class="small" fill="#047857">否</text>
  <path class="arrow" d="M650 291 H557"/>
  <path class="arrow" d="M315 291 C245 291 245 155 300 135"/>

  <rect x="55" y="255" width="190" height="70" rx="35" fill="#ede9fe"/>
  <text x="150" y="284" text-anchor="middle" class="label" fill="#6d28d9">本轮零错误</text>
  <text x="150" y="313" text-anchor="middle" class="small">停止训练</text>

</svg>
