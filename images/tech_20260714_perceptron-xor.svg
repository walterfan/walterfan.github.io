<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img"
     aria-labelledby="title description">
  <title id="title">XOR 为什么不能被一条直线分开</title>
  <desc id="description">XOR 的两个类别分别位于正方形的两条对角线上，因此不存在能完全分开它们的直线。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .axis { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 21px; }
  </style>
  <rect width="960" height="620" rx="28" fill="#ffffff"/>

  <rect x="115" y="55" width="610" height="455" rx="24" fill="#f8fafc"/>
  <line class="axis" x1="165" y1="455" x2="680" y2="455"/>
  <line class="axis" x1="165" y1="470" x2="165" y2="85"/>
  <path d="M662 446 L680 455 L662 464" fill="none" class="axis"/>
  <path d="M156 103 L165 85 L174 103" fill="none" class="axis"/>
  <line x1="260" y1="385" x2="565" y2="145" stroke="#2563eb" stroke-width="18" opacity="0.10" stroke-linecap="round"/>
  <line x1="260" y1="145" x2="565" y2="385" stroke="#e11d48" stroke-width="18" opacity="0.10" stroke-linecap="round"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="6">
    <circle cx="260" cy="385" r="24"/><circle cx="565" cy="145" r="24"/>
  </g>
  <g stroke="#e11d48" stroke-width="13" stroke-linecap="round">
    <path d="M243 128 l34 34 m0 -34 l-34 34"/>
    <path d="M548 368 l34 34 m0 -34 l-34 34"/>
  </g>
  <text x="260" y="430" text-anchor="middle" class="small">(0, 0)</text>
  <text x="260" y="115" text-anchor="middle" class="small">(0, 1)</text>
  <text x="565" y="430" text-anchor="middle" class="small">(1, 0)</text>
  <text x="565" y="115" text-anchor="middle" class="small">(1, 1)</text>
  <text x="430" y="495" text-anchor="middle" class="small">x₁</text>
  <text x="125" y="275" text-anchor="middle" class="small" transform="rotate(-90 125 275)">x₂</text>
  <rect x="745" y="125" width="175" height="70" rx="20" fill="#eff6ff"/>
  <circle cx="775" cy="160" r="13" fill="#2563eb"/>
  <text x="805" y="168" class="small">XOR = 0</text>
  <rect x="745" y="220" width="175" height="70" rx="20" fill="#fff1f2"/>
  <path d="M762 242 l26 26 m0 -26 l-26 26" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  <text x="805" y="263" class="small">XOR = 1</text>
  <rect x="190" y="530" width="580" height="60" rx="30" fill="#ede9fe"/>
  <text x="480" y="568" text-anchor="middle" class="label" fill="#6d28d9">同类各占一条对角线，一条直线无法完全分开</text>

</svg>
