<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"
     aria-labelledby="title description">
  <title id="title">Sigmoid 把任意实数压进 0 到 1</title>
  <desc id="description">Sigmoid 是一条 S 形曲线，把负无穷到正无穷的输入平滑地映射到 0 与 1 之间，在 x 等于 0 处取值 0.5。</desc>
