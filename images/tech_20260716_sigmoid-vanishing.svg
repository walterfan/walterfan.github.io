<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img"
     aria-labelledby="title description">
  <title id="title">梯度消失：一层层乘下去就没了</title>
  <desc id="description">初始为 1 的梯度每穿过一层最多乘以 0.25，经过五到六层后缩小到接近 0，导致靠前的参数几乎无法更新。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .axis { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .grid { stroke: #e2e8f0; stroke-width: 2; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .label { fill: #0f172a; font-size: 25px; font-weight: 650; }
    .small { fill: #475569; font-size: 21px; }
  </style>
  <rect width="960" height="420" rx="28" fill="#ffffff"/>

  <rect x="41.0" y="150" width="118" height="96" rx="10" fill="#f1f5f9"/>
  <rect x="41.0" y="150.0" width="118" height="96.0" rx="10" fill="#059669"/>
  <text x="100.0" y="280.0" text-anchor="middle" font-size="22" font-weight="700" fill="#059669">1.0</text>
  <text x="100.0" y="132.0" text-anchor="middle" class="small">初始梯度</text>
  <path class="arrow" d="M159.0 198 H193.0"/>

  <rect x="193.0" y="150" width="118" height="96" rx="10" fill="#f1f5f9"/>
  <rect x="193.0" y="198.0" width="118" height="48.0" rx="10" fill="#2563eb"/>
  <text x="252.0" y="280.0" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">0.25</text>
  <text x="252.0" y="132.0" text-anchor="middle" class="small">×0.25</text>
  <path class="arrow" d="M311.0 198 H345.0"/>

  <rect x="345.0" y="150" width="118" height="96" rx="10" fill="#f1f5f9"/>
  <rect x="345.0" y="222.0" width="118" height="24.0" rx="10" fill="#2563eb"/>
  <text x="404.0" y="280.0" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">0.0625</text>
  <text x="404.0" y="132.0" text-anchor="middle" class="small">×0.25</text>
  <path class="arrow" d="M463.0 198 H497.0"/>

  <rect x="497.0" y="150" width="118" height="96" rx="10" fill="#f1f5f9"/>
  <rect x="497.0" y="234.0" width="118" height="12.0" rx="10" fill="#2563eb"/>
  <text x="556.0" y="280.0" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">0.0156</text>
  <text x="556.0" y="132.0" text-anchor="middle" class="small">×0.25</text>
  <path class="arrow" d="M615.0 198 H649.0"/>

  <rect x="649.0" y="150" width="118" height="96" rx="10" fill="#f1f5f9"/>
  <rect x="649.0" y="240.0" width="118" height="6.0" rx="10" fill="#e11d48"/>
  <text x="708.0" y="280.0" text-anchor="middle" font-size="22" font-weight="700" fill="#e11d48">0.0039</text>
  <text x="708.0" y="132.0" text-anchor="middle" class="small">×0.25</text>
  <path class="arrow" d="M767.0 198 H801.0"/>

  <rect x="801.0" y="150" width="118" height="96" rx="10" fill="#f1f5f9"/>
  <rect x="801.0" y="242.0" width="118" height="4.0" rx="10" fill="#e11d48"/>
  <text x="860.0" y="280.0" text-anchor="middle" font-size="22" font-weight="700" fill="#e11d48">0.001</text>
  <text x="860.0" y="132.0" text-anchor="middle" class="small">×0.25</text>

  <text x="480" y="70" text-anchor="middle" class="label">梯度反向传播，每穿过一层最多乘以 0.25</text>
  <rect x="270" y="330" width="420" height="60" rx="30" fill="#fef2f2"/>
  <text x="480" y="368" text-anchor="middle" font-size="24" font-weight="700" fill="#be123c">五层之后，梯度几乎归零：参数改不动了</text>

</svg>
