<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="AI 语音客服延迟瀑布:串行方式各环节累加约 2.4 秒,流式方式首响应约 1 秒"><title>AI 语音客服延迟瀑布:串行 vs 流式</title><desc>上半部分展示串行等待:端点检测、ASR、网络与拼prompt、LLM首token、TTS首块逐段累加,总首响应约2.4秒。下半部分展示流式与流水线:各段重叠并行,用户听见第一个字约1秒。</desc><rect x="0" y="0" width="940" height="420" fill="#ffffff"/><text x="470.0" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#1E3A5F">从"说完"到"听见回话":串行 vs 流式</text><text x="20" y="98" font-size="13" font-weight="bold" fill="#c1121f">串行等待</text><text x="20" y="116" font-size="11" fill="#666">一段等完再下一段</text><rect x="150" y="80" width="120.0" height="34" rx="4" fill="#8ecae6"/><text x="210.0" y="101.0" font-size="11" text-anchor="middle" fill="#1a1a1a">端点检测</text><rect x="270.0" y="80" width="96.0" height="34" rx="4" fill="#219ebc"/><text x="318.0" y="101.0" font-size="11" text-anchor="middle" fill="#1a1a1a">ASR 出文本</text><rect x="366.0" y="80" width="9.6" height="34" rx="4" fill="#ffb703"/><text x="370.8" y="101.0" font-size="11" text-anchor="middle" fill="#1a1a1a"></text><rect x="375.6" y="80" width="288.0" height="34" rx="4" fill="#fb8500"/><text x="519.6" y="101.0" font-size="11" text-anchor="middle" fill="#1a1a1a">LLM TTFT</text><rect x="663.6" y="80" width="72.0" height="34" rx="4" fill="#e76f51"/><text x="699.6" y="101.0" font-size="11" text-anchor="middle" fill="#1a1a1a">TTS 首块</text><line x1="150" y1="130" x2="735.6" y2="130" stroke="#c1121f" stroke-width="1.5"/><text x="743.6" y="134" font-size="13" font-weight="bold" fill="#c1121f">≈ 2.4s</text><text x="20" y="248" font-size="13" font-weight="bold" fill="#2a9d8f">流式+流水线</text><text x="20" y="266" font-size="11" fill="#666">各段重叠并行</text><rect x="150.0" y="230" width="72.0" height="18" rx="4" fill="#8ecae6"/><text x="186.0" y="243.0" font-size="10" text-anchor="middle" fill="#1a1a1a"></text><rect x="178.8" y="250" width="84.0" height="18" rx="4" fill="#219ebc"/><text x="220.8" y="263.0" font-size="10" text-anchor="middle" fill="#1a1a1a"></text><rect x="241.2" y="230" width="120.0" height="18" rx="4" fill="#fb8500"/><text x="301.2" y="243.0" font-size="10" text-anchor="middle" fill="#1a1a1a">LLM TTFT</text><rect x="322.79999999999995" y="250" width="72.0" height="18" rx="4" fill="#e76f51"/><text x="358.79999999999995" y="263.0" font-size="10" text-anchor="middle" fill="#1a1a1a"></text><line x1="150" y1="288" x2="394.79999999999995" y2="288" stroke="#2a9d8f" stroke-width="1.5"/><text x="402.79999999999995" y="292" font-size="13" font-weight="bold" fill="#2a9d8f">≈ 1.0s 首响应</text><text x="470.0" y="404" font-size="11" text-anchor="middle" fill="#999">时间轴示意 · 数字为行业经验区间,非精确实测</text></svg>