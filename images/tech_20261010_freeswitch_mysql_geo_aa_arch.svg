<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">FreeSWITCH + MySQL 异地双活三层架构</title>
  <desc id="desc">两个机房（A、B）同时在线接客。信令层通过 GSLB 就近分流，FreeSWITCH 为无状态媒体工人，可 AP；数据层中扣减型数据走跨机房强一致（CP），追加型 CDR 两地本地写异步合并（AP）；媒体层的 RTP 流在接入机房就近锚定，无法跨机房漂移，故障时在另一机房快速重建。</desc>

  <style>
    .lbl { fill:#1f2937; font-size:13px; }
    .lbl-sm { fill:#4b5563; font-size:11px; }
    .box-title { fill:#111827; font-size:13px; font-weight:bold; }
    .dc-title { fill:#1E3A5F; font-size:15px; font-weight:bold; }
    .tag { font-size:11px; font-weight:bold; }
    .hdr { fill:#1E3A5F; font-size:16px; font-weight:bold; }
  </style>

  <!-- backdrop -->
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

  <!-- top: clients + GSLB -->
  <text x="460" y="30" text-anchor="middle" class="hdr">终端（SIP / WebRTC）</text>
  <rect x="380" y="42" width="160" height="34" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="460" y="64" text-anchor="middle" class="box-title">GSLB / DNS SRV 就近分流</text>

  <!-- DC A box -->
  <rect x="24" y="96" width="412" height="430" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="44" y="122" class="dc-title">机房 A（华东）· 在线接客</text>

  <!-- DC B box -->
  <rect x="484" y="96" width="412" height="430" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="504" y="122" class="dc-title">机房 B（华南）· 在线接客</text>

  <!-- ===== layer bands labels (left margin inside each DC drawn per box) ===== -->

  <!-- Signaling layer A -->
  <rect x="44" y="140" width="372" height="96" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3"/>
  <text x="56" y="160" class="box-title">信令层</text>
  <rect x="300" y="146" width="104" height="22" rx="11" fill="#10B981"/>
  <text x="352" y="161" text-anchor="middle" class="tag" fill="#ffffff">AP 可接管</text>
  <rect x="56" y="176" width="150" height="46" rx="8" fill="#ffffff" stroke="#10B981" stroke-width="1.2"/>
  <text x="131" y="196" text-anchor="middle" class="lbl">OpenSIPS 边缘</text>
  <text x="131" y="212" text-anchor="middle" class="lbl-sm">注册 / 路由（无状态）</text>
  <rect x="222" y="176" width="182" height="46" rx="8" fill="#ffffff" stroke="#10B981" stroke-width="1.2"/>
  <text x="313" y="196" text-anchor="middle" class="lbl">FreeSWITCH（媒体工人）</text>
  <text x="313" y="212" text-anchor="middle" class="lbl-sm">可抛弃 · 状态外置</text>

  <!-- Signaling layer B -->
  <rect x="504" y="140" width="372" height="96" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3"/>
  <text x="516" y="160" class="box-title">信令层</text>
  <rect x="760" y="146" width="104" height="22" rx="11" fill="#10B981"/>
  <text x="812" y="161" text-anchor="middle" class="tag" fill="#ffffff">AP 可接管</text>
  <rect x="516" y="176" width="150" height="46" rx="8" fill="#ffffff" stroke="#10B981" stroke-width="1.2"/>
  <text x="591" y="196" text-anchor="middle" class="lbl">OpenSIPS 边缘</text>
  <text x="591" y="212" text-anchor="middle" class="lbl-sm">注册 / 路由（无状态）</text>
  <rect x="682" y="176" width="182" height="46" rx="8" fill="#ffffff" stroke="#10B981" stroke-width="1.2"/>
  <text x="773" y="196" text-anchor="middle" class="lbl">FreeSWITCH（媒体工人）</text>
  <text x="773" y="212" text-anchor="middle" class="lbl-sm">可抛弃 · 状态外置</text>

  <!-- Media layer A -->
  <rect x="44" y="252" width="372" height="80" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="56" y="272" class="box-title">媒体层</text>
  <rect x="280" y="258" width="124" height="22" rx="11" fill="#F59E0B"/>
  <text x="342" y="273" text-anchor="middle" class="tag" fill="#ffffff">就近锚定</text>
  <rect x="56" y="288" width="348" height="36" rx="8" fill="#ffffff" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="230" y="311" text-anchor="middle" class="lbl">rtpengine · RTP/SRTP 流钉死在本机房</text>

  <!-- Media layer B -->
  <rect x="504" y="252" width="372" height="80" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="516" y="272" class="box-title">媒体层</text>
  <rect x="740" y="258" width="124" height="22" rx="11" fill="#F59E0B"/>
  <text x="802" y="273" text-anchor="middle" class="tag" fill="#ffffff">就近锚定</text>
  <rect x="516" y="288" width="348" height="36" rx="8" fill="#ffffff" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="690" y="311" text-anchor="middle" class="lbl">rtpengine · RTP/SRTP 流钉死在本机房</text>

  <!-- Data layer A -->
  <rect x="44" y="348" width="372" height="162" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="56" y="368" class="box-title">数据层 · MySQL</text>
  <rect x="56" y="380" width="348" height="54" rx="8" fill="#ffffff" stroke="#EF4444" stroke-width="1.4"/>
  <rect x="300" y="386" width="98" height="20" rx="10" fill="#EF4444"/>
  <text x="349" y="400" text-anchor="middle" class="tag" fill="#ffffff">CP 强一致</text>
  <text x="68" y="400" class="lbl">扣减型</text>
  <text x="68" y="418" class="lbl-sm">余额 / 并发额度 · 防超卖</text>
  <rect x="56" y="444" width="348" height="56" rx="8" fill="#ffffff" stroke="#3B82F6" stroke-width="1.2"/>
  <rect x="300" y="450" width="98" height="20" rx="10" fill="#3B82F6"/>
  <text x="349" y="464" text-anchor="middle" class="tag" fill="#ffffff">AP 最终一致</text>
  <text x="68" y="464" class="lbl">追加型</text>
  <text x="68" y="482" class="lbl-sm">CDR / 日志 · 两地本地写</text>

  <!-- Data layer B -->
  <rect x="504" y="348" width="372" height="162" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="516" y="368" class="box-title">数据层 · MySQL</text>
  <rect x="516" y="380" width="348" height="54" rx="8" fill="#ffffff" stroke="#EF4444" stroke-width="1.4"/>
  <rect x="760" y="386" width="98" height="20" rx="10" fill="#EF4444"/>
  <text x="809" y="400" text-anchor="middle" class="tag" fill="#ffffff">CP 强一致</text>
  <text x="528" y="400" class="lbl">扣减型</text>
  <text x="528" y="418" class="lbl-sm">余额 / 并发额度 · 防超卖</text>
  <rect x="516" y="444" width="348" height="56" rx="8" fill="#ffffff" stroke="#3B82F6" stroke-width="1.2"/>
  <rect x="760" y="450" width="98" height="20" rx="10" fill="#3B82F6"/>
  <text x="809" y="464" text-anchor="middle" class="tag" fill="#ffffff">AP 最终一致</text>
  <text x="528" y="464" class="lbl">追加型</text>
  <text x="528" y="482" class="lbl-sm">CDR / 日志 · 两地本地写</text>

  <!-- GSLB to DCs -->
  <line x1="420" y1="76" x2="230" y2="140" stroke="#6366F1" stroke-width="1.6"/>
  <line x1="500" y1="76" x2="690" y2="140" stroke="#6366F1" stroke-width="1.6"/>

  <!-- cross-DC CP sync (strong, red solid) -->
  <line x1="404" y1="407" x2="516" y2="407" stroke="#EF4444" stroke-width="2.4"/>
  <text x="460" y="400" text-anchor="middle" class="tag" fill="#EF4444">跨机房强一致</text>
  <text x="460" y="424" text-anchor="middle" class="lbl-sm" fill="#EF4444">交光速 RTT 的税</text>

  <!-- cross-DC AP sync (async, blue dashed) -->
  <line x1="404" y1="472" x2="516" y2="472" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="460" y="492" text-anchor="middle" class="lbl-sm" fill="#3B82F6">异步合并</text>

  <!-- media: NO cross-DC (marked) -->
  <line x1="404" y1="306" x2="516" y2="306" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 6"/>
  <text x="460" y="300" text-anchor="middle" class="tag" fill="#B45309">媒体不漂移</text>
  <text x="460" y="340" text-anchor="middle" class="lbl-sm" fill="#B45309">故障→另一机房重建</text>
</svg>
