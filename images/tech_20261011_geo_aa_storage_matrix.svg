<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">异地双活存储选型矩阵：四类数据 × 四种存储</title>
  <desc id="desc">矩阵的四行是四类数据：信令/会话（AP）、扣减型（CP）、追加型（AP）、协调/元数据（CP）；四列是四种存储：Redis、NewSQL、Cassandra、etcd。每格标出适配度。首选：信令用 Redis，扣减用 NewSQL，追加用 Cassandra，协调用 etcd。Redis 用于扣减被标为埋雷。</desc>

  <style>
    .hdr { fill:#1E3A5F; font-size:14px; font-weight:bold; }
    .rowh { fill:#111827; font-size:13px; font-weight:bold; }
    .rowh-sm { fill:#6b7280; font-size:10px; }
    .cell { font-size:12px; }
    .best { fill:#065F46; font-size:12px; font-weight:bold; }
    .bad  { fill:#991B1B; font-size:12px; font-weight:bold; }
    .ok   { fill:#92400E; font-size:11px; }
    .no   { fill:#9CA3AF; font-size:11px; }
  </style>

  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" class="hdr" font-size="17">异地双活存储选型：每类数据配最懂它的库</text>

  <!-- column headers -->
  <g>
    <rect x="250" y="52" width="150" height="42" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
    <text x="325" y="78" text-anchor="middle" class="hdr">Redis</text>
    <rect x="410" y="52" width="150" height="42" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
    <text x="485" y="78" text-anchor="middle" class="hdr">NewSQL</text>
    <rect x="570" y="52" width="150" height="42" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.3"/>
    <text x="645" y="78" text-anchor="middle" class="hdr">Cassandra</text>
    <rect x="730" y="52" width="150" height="42" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3"/>
    <text x="805" y="78" text-anchor="middle" class="hdr">etcd</text>
  </g>

  <!-- Row 1: 信令/会话 AP -->
  <rect x="20" y="104" width="222" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="34" y="138" class="rowh">信令 / 会话</text>
  <text x="34" y="156" class="rowh-sm">AP · 可短暂不一致</text>
  <rect x="250" y="104" width="150" height="80" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="325" y="138" text-anchor="middle" class="best">★ 首选</text>
  <text x="325" y="158" text-anchor="middle" class="cell">TTL 对齐 SIP 租期</text>
  <rect x="410" y="104" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="485" y="148" text-anchor="middle" class="no">偏重，没必要</text>
  <rect x="570" y="104" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="645" y="148" text-anchor="middle" class="no">不合适</text>
  <rect x="730" y="104" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="805" y="148" text-anchor="middle" class="no">非业务库</text>

  <!-- Row 2: 扣减型 CP -->
  <rect x="20" y="192" width="222" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="34" y="226" class="rowh">扣减型（余额/额度）</text>
  <text x="34" y="244" class="rowh-sm">CP · 防超卖</text>
  <rect x="250" y="192" width="150" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="325" y="226" text-anchor="middle" class="bad">⚠ 埋雷</text>
  <text x="325" y="246" text-anchor="middle" class="cell" fill="#991B1B">裸多写必超卖</text>
  <rect x="410" y="192" width="150" height="80" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="485" y="226" text-anchor="middle" class="best" fill="#1E3A8A">★ 首选</text>
  <text x="485" y="246" text-anchor="middle" class="cell">Raft 内建强一致</text>
  <rect x="570" y="192" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="645" y="236" text-anchor="middle" class="no">不适合强一致</text>
  <rect x="730" y="192" width="150" height="80" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="805" y="230" text-anchor="middle" class="ok">配合选主</text>
  <text x="805" y="248" text-anchor="middle" class="ok">+MySQL 可用</text>

  <!-- Row 3: 追加型 AP -->
  <rect x="20" y="280" width="222" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="34" y="314" class="rowh">追加型（CDR/日志）</text>
  <text x="34" y="332" class="rowh-sm">AP · 最终一致</text>
  <rect x="250" y="280" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="325" y="324" text-anchor="middle" class="no">内存扛不住海量</text>
  <rect x="410" y="280" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="485" y="324" text-anchor="middle" class="ok">可用，偏贵</text>
  <rect x="570" y="280" width="150" height="80" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="645" y="314" text-anchor="middle" class="best" fill="#5B21B6">★ 首选</text>
  <text x="645" y="334" text-anchor="middle" class="cell">对等写+LOCAL_QUORUM</text>
  <rect x="730" y="280" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="805" y="324" text-anchor="middle" class="no">非业务库</text>

  <!-- Row 4: 协调/元数据 CP -->
  <rect x="20" y="368" width="222" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="34" y="402" class="rowh">协调 / 元数据</text>
  <text x="34" y="420" class="rowh-sm">CP · 选主/锁/配置</text>
  <rect x="250" y="368" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="325" y="404" text-anchor="middle" class="ok">Redlock 有争议</text>
  <text x="325" y="422" text-anchor="middle" class="no">正确性难保证</text>
  <rect x="410" y="368" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="485" y="412" text-anchor="middle" class="no">杀鸡用牛刀</text>
  <rect x="570" y="368" width="150" height="80" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
  <text x="645" y="412" text-anchor="middle" class="no">不适合</text>
  <rect x="730" y="368" width="150" height="80" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="805" y="402" text-anchor="middle" class="best">★ 首选</text>
  <text x="805" y="422" text-anchor="middle" class="cell">裁判不是球员</text>
</svg>
