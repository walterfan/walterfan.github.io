<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">Redis Cluster 异地双活的三种拓扑</title>
  <desc id="desc">三种跨机房 Redis 拓扑。拓扑一：单集群跨机房，主从分布在两地，跨机房异步复制且脑裂风险高，不推荐。拓扑二：双独立集群单向复制，A 为写集群、B 只读灾备，本质主备不是双活。拓扑三：双独立集群双向复制，两地各写各的 key 空间，靠 key 前缀分区避免冲突，是开源能做到的务实双活；真正的单 key 多地写需要企业版 CRDT。</desc>

  <style>
    .hdr { fill:#1E3A5F; font-size:16px; font-weight:bold; }
    .cap { fill:#111827; font-size:13px; font-weight:bold; }
    .cap-sm { fill:#6b7280; font-size:11px; }
    .dc { fill:#1E3A5F; font-size:12px; font-weight:bold; }
    .node { fill:#111827; font-size:11px; }
    .ok  { fill:#065F46; font-size:11px; font-weight:bold; }
    .bad { fill:#991B1B; font-size:11px; font-weight:bold; }
    .warn{ fill:#92400E; font-size:11px; font-weight:bold; }
  </style>
  <rect x="0" y="0" width="920" height="660" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" class="hdr">Redis Cluster 异地双活的三种拓扑</text>

  <!-- ===================== 拓扑一：单集群跨机房 ===================== -->
  <text x="24" y="62" class="cap">① 单集群跨机房 —— 一个 Redis Cluster 拉到两地</text>
  <rect x="16" y="72" width="888" height="130" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
  <!-- DC A -->
  <rect x="40" y="90" width="360" height="96" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="56" y="110" class="dc">机房 A</text>
  <circle cx="110" cy="148" r="22" fill="#DBEAFE" stroke="#3B82F6"/><text x="110" y="152" text-anchor="middle" class="node">M1</text>
  <circle cx="200" cy="148" r="22" fill="#DBEAFE" stroke="#3B82F6"/><text x="200" y="152" text-anchor="middle" class="node">M2</text>
  <circle cx="300" cy="148" r="20" fill="#F1F5F9" stroke="#94A3B8"/><text x="300" y="152" text-anchor="middle" class="node">S3</text>
  <!-- DC B -->
  <rect x="520" y="90" width="360" height="96" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="536" y="110" class="dc">机房 B</text>
  <circle cx="620" cy="148" r="20" fill="#F1F5F9" stroke="#94A3B8"/><text x="620" y="152" text-anchor="middle" class="node">S1</text>
  <circle cx="710" cy="148" r="20" fill="#F1F5F9" stroke="#94A3B8"/><text x="710" y="152" text-anchor="middle" class="node">S2</text>
  <circle cx="800" cy="148" r="22" fill="#DBEAFE" stroke="#3B82F6"/><text x="800" y="152" text-anchor="middle" class="node">M3</text>
  <!-- gossip/replication cross link -->
  <line x1="400" y1="148" x2="520" y2="148" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="460" y="140" text-anchor="middle" class="bad">gossip + 异步复制跨机房</text>
  <text x="460" y="176" text-anchor="middle" class="bad">⚠ 脑裂风险高 · 不推荐</text>

  <!-- ===================== 拓扑二：双集群单向 ===================== -->
  <text x="24" y="238" class="cap">② 双独立集群 · 单向复制 —— 本质是主备,不是双活</text>
  <rect x="16" y="248" width="888" height="140" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.3"/>
  <!-- DC A: write cluster -->
  <rect x="40" y="266" width="360" height="106" rx="8" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="286" class="dc">机房 A · 写集群</text>
  <text x="330" y="286" text-anchor="end" class="ok">可读写</text>
  <circle cx="120" cy="330" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="120" y="334" text-anchor="middle" class="node">M1</text>
  <circle cx="210" cy="330" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="210" y="334" text-anchor="middle" class="node">M2</text>
  <circle cx="300" cy="330" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="300" y="334" text-anchor="middle" class="node">M3</text>
  <!-- DC B: read-only replica cluster -->
  <rect x="520" y="266" width="360" height="106" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="536" y="286" class="dc">机房 B · 只读灾备集群</text>
  <text x="862" y="286" text-anchor="end" class="warn">只读</text>
  <circle cx="620" cy="330" r="22" fill="#F1F5F9" stroke="#94A3B8"/><text x="620" y="334" text-anchor="middle" class="node">R1</text>
  <circle cx="710" cy="330" r="22" fill="#F1F5F9" stroke="#94A3B8"/><text x="710" y="334" text-anchor="middle" class="node">R2</text>
  <circle cx="800" cy="330" r="22" fill="#F1F5F9" stroke="#94A3B8"/><text x="800" y="334" text-anchor="middle" class="node">R3</text>
  <!-- one-way replication arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#F59E0B"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#10B981"/></marker>
  </defs>
  <line x1="400" y1="330" x2="518" y2="330" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="460" y="322" text-anchor="middle" class="warn">单向复制 →</text>
  <text x="460" y="384" text-anchor="middle" class="cap-sm">A 挂了才切 B,B 平时不接写</text>

  <!-- ===================== 拓扑三：双集群双向 ===================== -->
  <text x="24" y="424" class="cap">③ 双独立集群 · 双向复制 + key 前缀分区 —— 开源能做到的务实双活</text>
  <rect x="16" y="434" width="888" height="170" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3"/>
  <!-- DC A -->
  <rect x="40" y="452" width="360" height="110" rx="8" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="472" class="dc">机房 A · 写 a:* 读全部</text>
  <circle cx="120" cy="516" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="120" y="520" text-anchor="middle" class="node">M1</text>
  <circle cx="210" cy="516" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="210" y="520" text-anchor="middle" class="node">M2</text>
  <circle cx="300" cy="516" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="300" y="520" text-anchor="middle" class="node">M3</text>
  <!-- DC B -->
  <rect x="520" y="452" width="360" height="110" rx="8" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
  <text x="536" y="472" class="dc">机房 B · 写 b:* 读全部</text>
  <circle cx="620" cy="516" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="620" y="520" text-anchor="middle" class="node">M1</text>
  <circle cx="710" cy="516" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="710" y="520" text-anchor="middle" class="node">M2</text>
  <circle cx="800" cy="516" r="22" fill="#D1FAE5" stroke="#10B981"/><text x="800" y="520" text-anchor="middle" class="node">M3</text>
  <!-- bidirectional replication -->
  <line x1="400" y1="506" x2="518" y2="506" stroke="#10B981" stroke-width="2.4" marker-end="url(#arrowG)"/>
  <line x1="518" y1="526" x2="400" y2="526" stroke="#10B981" stroke-width="2.4" marker-end="url(#arrowG)"/>
  <text x="460" y="498" text-anchor="middle" class="ok">双向复制</text>
  <text x="460" y="590" text-anchor="middle" class="cap-sm">各写各的 key 空间(a:* / b:*),天然不冲突;单 key 多地写需企业版 CRDT</text>

  <!-- legend -->
  <text x="24" y="636" class="cap-sm">图例：</text>
  <circle cx="86" cy="632" r="9" fill="#D1FAE5" stroke="#10B981"/><text x="100" y="636" class="cap-sm">可写主节点</text>
  <circle cx="200" cy="632" r="9" fill="#DBEAFE" stroke="#3B82F6"/><text x="214" y="636" class="cap-sm">主(单集群)</text>
  <circle cx="330" cy="632" r="9" fill="#F1F5F9" stroke="#94A3B8"/><text x="344" y="636" class="cap-sm">从/只读</text>
</svg>
