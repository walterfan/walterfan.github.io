<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">RTO、RPO 的含义与常用容灾做法的成本梯度</title>
  <desc id="desc">上半部分是一根时间轴：故障点 T0 左边是 RPO 窗口，等于丢失的数据，由最后一个安全数据点到故障时刻；T0 右边是 RTO 窗口，等于停机时长，由故障到服务恢复可用。RPO 往左看丢数据，RTO 往右看停服务。下半部分是五档容灾做法的成本梯度，从便宜到贵：冷备份、主备异步、主备半同步、双活、多活/强一致，RPO 和 RTO 越小成本越高。</desc>
  <style>
    .hdr { fill:#1E3A5F; font-size:16px; font-weight:bold; }
    .sub { fill:#1E3A5F; font-size:14px; font-weight:bold; }
    .lbl { fill:#111827; font-size:12px; }
    .lbl-sm { fill:#4b5563; font-size:11px; }
    .rpo { fill:#991B1B; font-size:12px; font-weight:bold; }
    .rto { fill:#1E3A8A; font-size:12px; font-weight:bold; }
    .ok  { fill:#065F46; font-size:11px; font-weight:bold; }
  </style>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <!-- ========= Part 1: timeline ========= -->
  <text x="450" y="30" text-anchor="middle" class="hdr">RTO 与 RPO:一个管"停多久",一个管"丢多少"</text>

  <!-- axis -->
  <line x1="60" y1="150" x2="840" y2="150" stroke="#334155" stroke-width="2"/>
  <polygon points="840,150 830,145 830,155" fill="#334155"/>
  <text x="852" y="154" class="lbl-sm">时间</text>

  <!-- failure point -->
  <line x1="450" y1="100" x2="450" y2="200" stroke="#EF4444" stroke-width="2.4"/>
  <circle cx="450" cy="150" r="6" fill="#EF4444"/>
  <text x="450" y="92" text-anchor="middle" class="rpo">T0 故障发生</text>

  <!-- RPO window (left) -->
  <rect x="300" y="120" width="150" height="30" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
  <line x1="300" y1="150" x2="300" y2="110" stroke="#991B1B" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="300" y="104" text-anchor="middle" class="lbl-sm">最后一个安全数据点</text>
  <text x="375" y="140" text-anchor="middle" class="rpo">RPO 窗口</text>
  <text x="375" y="178" text-anchor="middle" class="rpo">= 丢失的数据</text>
  <text x="375" y="196" text-anchor="middle" class="lbl-sm">往左看:丢数据</text>

  <!-- RTO window (right) -->
  <rect x="450" y="120" width="180" height="30" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
  <line x1="630" y1="150" x2="630" y2="110" stroke="#1E3A8A" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="630" y="104" text-anchor="middle" class="lbl-sm">服务恢复可用</text>
  <text x="540" y="140" text-anchor="middle" class="rto">RTO 窗口</text>
  <text x="540" y="178" text-anchor="middle" class="rto">= 停机时长</text>
  <text x="540" y="196" text-anchor="middle" class="lbl-sm">往右看:停服务</text>

  <text x="450" y="228" text-anchor="middle" class="lbl-sm">RP<tspan font-weight="bold">O</tspan> = Recovery <tspan fill="#991B1B" font-weight="bold">Point</tspan> Objective(数据点,丢数据)　·　RT<tspan font-weight="bold">O</tspan> = Recovery <tspan fill="#1E3A8A" font-weight="bold">Time</tspan> Objective(时间,停服务)</text>

  <!-- divider -->
  <line x1="60" y1="252" x2="840" y2="252" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ========= Part 2: DR method gradient ========= -->
  <text x="450" y="282" text-anchor="middle" class="hdr">常用容灾做法:RPO/RTO 越小,成本越高</text>

  <!-- gradient arrow -->
  <text x="70" y="316" class="ok">便宜 · RPO/RTO 大</text>
  <text x="830" y="316" text-anchor="end" class="rpo">贵 · RPO/RTO 小</text>
  <line x1="70" y1="326" x2="830" y2="326" stroke="#9CA3AF" stroke-width="2" marker-end="url(#g)"/>
  <defs><marker id="g" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#9CA3AF"/></marker></defs>

  <!-- 5 cards -->
  <g>
    <rect x="60" y="346" width="148" height="210" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="1.3"/>
    <text x="134" y="372" text-anchor="middle" class="sub">① 冷备份</text>
    <text x="134" y="396" text-anchor="middle" class="lbl-sm">定期快照/导出</text>
    <text x="134" y="416" text-anchor="middle" class="lbl-sm">存异地</text>
    <rect x="74" y="432" width="120" height="24" rx="6" fill="#FEF2F2"/><text x="134" y="449" text-anchor="middle" class="rpo">RPO:小时~天</text>
    <rect x="74" y="462" width="120" height="24" rx="6" fill="#EFF6FF"/><text x="134" y="479" text-anchor="middle" class="rto">RTO:小时级</text>
    <text x="134" y="510" text-anchor="middle" class="lbl-sm">最省钱</text>
    <text x="134" y="528" text-anchor="middle" class="lbl-sm">丢得多/恢复慢</text>
  </g>
  <g>
    <rect x="216" y="346" width="148" height="210" rx="10" fill="#F7FEE7" stroke="#84CC16" stroke-width="1.3"/>
    <text x="290" y="372" text-anchor="middle" class="sub">② 主备异步</text>
    <text x="290" y="396" text-anchor="middle" class="lbl-sm">热备实时异步</text>
    <text x="290" y="416" text-anchor="middle" class="lbl-sm">复制(本方案)</text>
    <rect x="230" y="432" width="120" height="24" rx="6" fill="#FEF2F2"/><text x="290" y="449" text-anchor="middle" class="rpo">RPO:秒级(&gt;0)</text>
    <rect x="230" y="462" width="120" height="24" rx="6" fill="#EFF6FF"/><text x="290" y="479" text-anchor="middle" class="rto">RTO:秒~分钟</text>
    <text x="290" y="510" text-anchor="middle" class="lbl-sm">性价比高</text>
    <text x="290" y="528" text-anchor="middle" class="lbl-sm">丢复制延迟那段</text>
  </g>
  <g>
    <rect x="372" y="346" width="148" height="210" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="446" y="372" text-anchor="middle" class="sub">③ 主备半同步</text>
    <text x="446" y="396" text-anchor="middle" class="lbl-sm">WAIT 等对端 ACK</text>
    <text x="446" y="416" text-anchor="middle" class="lbl-sm">再返回</text>
    <rect x="386" y="432" width="120" height="24" rx="6" fill="#FEF2F2"/><text x="446" y="449" text-anchor="middle" class="rpo">RPO:近零</text>
    <rect x="386" y="462" width="120" height="24" rx="6" fill="#EFF6FF"/><text x="446" y="479" text-anchor="middle" class="rto">RTO:秒级</text>
    <text x="446" y="510" text-anchor="middle" class="lbl-sm">每写 +1 RTT</text>
    <text x="446" y="528" text-anchor="middle" class="lbl-sm">对端抖动则变慢</text>
  </g>
  <g>
    <rect x="528" y="346" width="148" height="210" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.3"/>
    <text x="602" y="372" text-anchor="middle" class="sub">④ 双活</text>
    <text x="602" y="396" text-anchor="middle" class="lbl-sm">两地同时接客</text>
    <text x="602" y="416" text-anchor="middle" class="lbl-sm">按域分写</text>
    <rect x="542" y="432" width="120" height="24" rx="6" fill="#FEF2F2"/><text x="602" y="449" text-anchor="middle" class="rpo">RPO:近零~零</text>
    <rect x="542" y="462" width="120" height="24" rx="6" fill="#EFF6FF"/><text x="602" y="479" text-anchor="middle" class="rto">RTO:秒级</text>
    <text x="602" y="510" text-anchor="middle" class="lbl-sm">两地利用率高</text>
    <text x="602" y="528" text-anchor="middle" class="lbl-sm">架构/运维复杂</text>
  </g>
  <g>
    <rect x="684" y="346" width="156" height="210" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="762" y="372" text-anchor="middle" class="sub">⑤ 多活/强一致</text>
    <text x="762" y="396" text-anchor="middle" class="lbl-sm">共识协议多副本</text>
    <text x="762" y="416" text-anchor="middle" class="lbl-sm">(Raft/CRDT)</text>
    <rect x="698" y="432" width="128" height="24" rx="6" fill="#FEF2F2"/><text x="762" y="449" text-anchor="middle" class="rpo">RPO:0</text>
    <rect x="698" y="462" width="128" height="24" rx="6" fill="#EFF6FF"/><text x="762" y="479" text-anchor="middle" class="rto">RTO:亚秒~秒</text>
    <text x="762" y="510" text-anchor="middle" class="lbl-sm">最强保证</text>
    <text x="762" y="528" text-anchor="middle" class="lbl-sm">最贵 + 写延迟高</text>
  </g>

  <text x="450" y="584" text-anchor="middle" class="lbl-sm">选哪一档,由业务对"能丢多少(RPO)、能停多久(RTO)"的容忍度决定,不是越强越好</text>
</svg>
