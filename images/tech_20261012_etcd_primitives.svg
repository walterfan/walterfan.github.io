<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="auto" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">etcd 四种用法的共同原语：lease、revision、watch</title>
  <desc id="d">选主、分布式锁、配置下发、服务注册四种用法，底层都靠带 TTL 的 lease、全局单调递增的 revision，以及按 revision 顺序推送的 watch。</desc>
  <rect x="0" y="0" width="900" height="470" fill="#FFFFFF"/>
  <text x="30" y="40" text-anchor="start" font-size="18" font-weight="700" fill="#1E3A5F">四种用法，两个原语（lease + revision），一个通道（watch）</text>
  <rect x="30" y="60" width="840" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="150" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">lease（带 TTL 的活着凭证）</text>
  <text x="150" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">不续约 → key 自动删除</text>
  <text x="450" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">revision（全局单调递增版本号）</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">认 revision，不认墙上时钟</text>
  <text x="760" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">watch（按 revision 顺序推送）</text>
  <text x="760" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">不漏、不乱序</text>
  <rect x="30" y="165" width="198" height="240" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="129.0" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">选主 Election</text>
  <line x1="50" y1="213" x2="208" y2="213" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <text x="129.0" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">Campaign 竞选</text>
  <text x="129.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">赢家身份绑 lease</text>
  <text x="129.0" y="311" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">进程挂 → lease 到期 → 他人接替</text>
  <line x1="129.0" y1="124" x2="129.0" y2="165" stroke="#9AA7B4" stroke-width="1.5"/>
  <rect x="244" y="165" width="198" height="240" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="343.0" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">分布式锁 Mutex</text>
  <line x1="264" y1="213" x2="422" y2="213" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <text x="343.0" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">按 revision 排队</text>
  <text x="343.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">最小 revision 拿锁</text>
  <text x="343.0" y="311" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">持锁进程挂 → 锁自动释放</text>
  <line x1="343.0" y1="124" x2="343.0" y2="165" stroke="#9AA7B4" stroke-width="1.5"/>
  <rect x="458" y="165" width="198" height="240" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="557.0" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">配置下发</text>
  <line x1="478" y1="213" x2="636" y2="213" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <text x="557.0" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">Watch 一个 key</text>
  <text x="557.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">Txn: compare revision</text>
  <text x="557.0" y="311" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">所有消费方按序收到同一版</text>
  <line x1="557.0" y1="124" x2="557.0" y2="165" stroke="#9AA7B4" stroke-width="1.5"/>
  <rect x="672" y="165" width="198" height="240" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="771.0" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">服务注册</text>
  <line x1="692" y1="213" x2="850" y2="213" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <text x="771.0" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">写实例 + 绑 lease</text>
  <text x="771.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">持续 keepalive</text>
  <text x="771.0" y="311" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">实例挂 → key 消失 → 自动摘除</text>
  <line x1="771.0" y1="124" x2="771.0" y2="165" stroke="#9AA7B4" stroke-width="1.5"/>
  <text x="450" y="441" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">共性：死节点靠 lease 自动清理，先后/版本靠 revision 判定，变更靠 watch 一致下发</text>
</svg>
