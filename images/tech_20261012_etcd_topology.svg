<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">etcd 拓扑：3 节点单机房与跨三机房 1+1+1</title>
  <desc id="d">左侧：机房内 3 节点集群，quorum=2，可容忍 1 台宕机。右侧：跨三机房 1+1+1，每机房 1 节点，任一机房整体故障后另两机房仍可凑 2 票。</desc>
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>
  <text x="30" y="40" text-anchor="start" font-size="18" font-weight="700" fill="#1E3A5F">两种常见拓扑，取舍单位都是 quorum</text>
  <text x="30" y="80" text-anchor="start" font-size="14" font-weight="700" fill="#1E3A5F">① 单机房 3 节点（最常见）</text>
  <rect x="40" y="95" width="360" height="200" rx="12" fill="#F8F9FA" stroke="#9AA7B4" stroke-width="1.5"/>
  <text x="220" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">机房 DC-1</text>
  <line x1="220" y1="150" x2="120" y2="250" stroke="#9AA7B4" stroke-width="1.5"/>
  <line x1="220" y1="150" x2="320" y2="250" stroke="#9AA7B4" stroke-width="1.5"/>
  <line x1="120" y1="250" x2="320" y2="250" stroke="#9AA7B4" stroke-width="1.5"/>
  <circle cx="220" cy="150" r="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="220" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">etcd-1</text>
  <text x="220" y="166" text-anchor="middle" font-size="11" fill="#5B6B7B">leader</text>
  <circle cx="120" cy="250" r="34" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="120" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#1565C0">etcd-2</text>
  <text x="120" y="266" text-anchor="middle" font-size="11" fill="#5B6B7B">follower</text>
  <circle cx="320" cy="250" r="34" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="320" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#1565C0">etcd-3</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#5B6B7B">follower</text>
  <text x="220" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">quorum = 2，可挂 1 台</text>
  <text x="490" y="80" text-anchor="start" font-size="14" font-weight="700" fill="#1E3A5F">② 跨三机房 1 + 1 + 1（高可用）</text>
  <rect x="508" y="110" width="104" height="150" rx="10" fill="#F8F9FA" stroke="#9AA7B4" stroke-width="1.5"/>
  <text x="560" y="132" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">DC-1</text>
  <circle cx="560" cy="190" r="32" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="560" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">etcd</text>
  <text x="560" y="206" text-anchor="middle" font-size="11" fill="#5B6B7B">leader</text>
  <rect x="638" y="110" width="104" height="150" rx="10" fill="#F8F9FA" stroke="#9AA7B4" stroke-width="1.5"/>
  <text x="690" y="132" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">DC-2</text>
  <circle cx="690" cy="190" r="32" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="690" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#1565C0">etcd</text>
  <text x="690" y="206" text-anchor="middle" font-size="11" fill="#5B6B7B">follower</text>
  <rect x="768" y="110" width="104" height="150" rx="10" fill="#F8F9FA" stroke="#9AA7B4" stroke-width="1.5"/>
  <text x="820" y="132" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">DC-3</text>
  <circle cx="820" cy="190" r="32" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="820" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#1565C0">etcd</text>
  <text x="820" y="206" text-anchor="middle" font-size="11" fill="#5B6B7B">follower</text>
  <line x1="560" y1="190" x2="690" y2="190" stroke="#9AA7B4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="690" y1="190" x2="820" y2="190" stroke="#9AA7B4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="690" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">任一机房挂，另两机房仍凑 2 票</text>
  <text x="30" y="335" text-anchor="start" font-size="14" font-weight="700" fill="#1E3A5F">quorum = ⌊N/2⌋ + 1</text>
  <text x="40" y="360" text-anchor="start" font-size="13" font-weight="700" fill="#1E3A5F">节点数 N</text>
  <text x="200" y="360" text-anchor="start" font-size="13" font-weight="700" fill="#1E3A5F">quorum</text>
  <text x="330" y="360" text-anchor="start" font-size="13" font-weight="700" fill="#1E3A5F">可容忍宕机</text>
  <text x="490" y="360" text-anchor="start" font-size="13" font-weight="700" fill="#1E3A5F">点评</text>
  <line x1="40" y1="368" x2="820" y2="368" stroke="#9AA7B4" stroke-width="1"/>
  <text x="40" y="388" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">3</text>
  <text x="200" y="388" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">2</text>
  <text x="330" y="388" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">1</text>
  <text x="490" y="388" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">性价比最高</text>
  <text x="40" y="416" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">5</text>
  <text x="200" y="416" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">3</text>
  <text x="330" y="416" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">2</text>
  <text x="490" y="416" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">更高可用</text>
  <text x="40" y="444" text-anchor="start" font-size="13" font-weight="400" fill="#C62828">4</text>
  <text x="200" y="444" text-anchor="start" font-size="13" font-weight="400" fill="#C62828">3</text>
  <text x="330" y="444" text-anchor="start" font-size="13" font-weight="400" fill="#C62828">1</text>
  <text x="490" y="444" text-anchor="start" font-size="13" font-weight="400" fill="#C62828">反例：成本高、容错同 3</text>
</svg>
