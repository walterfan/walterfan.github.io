<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="auto" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">网络分区下 Redis/MySQL 脑裂 vs etcd 多数派仲裁</title>
  <desc id="d">上半部分：Redis/MySQL 在分区两侧各自选出一个主，形成两个 leader（脑裂）。下半部分：etcd 中多数派一侧选出唯一 leader，少数派一侧因凑不齐多数派票而自动失效。</desc>
  <rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>
  <text x="30" y="40" text-anchor="start" font-size="18" font-weight="700" fill="#1E3A5F">同一场网络分区，两种结局</text>
  <line x1="450" y1="60" x2="450" y2="500" stroke="#C62828" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="450" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#C62828">网络分区</text>
  <text x="30" y="120" text-anchor="start" font-size="14" font-weight="700" fill="#1E3A5F">Redis / MySQL（异步复制 + 哨兵）</text>
  <circle cx="230" cy="200" r="46" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/>
  <text x="230" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">node-A</text>
  <text x="230" y="216" text-anchor="middle" font-size="11" fill="#5B6B7B">自认是主</text>
  <circle cx="670" cy="200" r="46" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/>
  <text x="670" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">node-B</text>
  <text x="670" y="216" text-anchor="middle" font-size="11" fill="#5B6B7B">也自认是主</text>
  <text x="230" y="275" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">哨兵提升 A 侧为主</text>
  <text x="670" y="275" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6B7B">旧主未退位，仍在写</text>
  <text x="450" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">✗ 两个主</text>
  <text x="450" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#C62828">脑裂</text>
  <line x1="30" y1="300" x2="870" y2="300" stroke="#9AA7B4" stroke-width="1"/>
  <text x="30" y="335" text-anchor="start" font-size="14" font-weight="700" fill="#1E3A5F">etcd（Raft 多数派，3 节点被切成 2 + 1）</text>
  <circle cx="180" cy="420" r="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="180" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">etcd-1</text>
  <text x="180" y="436" text-anchor="middle" font-size="11" fill="#5B6B7B">leader</text>
  <circle cx="320" cy="420" r="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="320" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#1565C0">etcd-2</text>
  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#5B6B7B">follower</text>
  <line x1="220" y1="420" x2="280" y2="420" stroke="#2E7D32" stroke-width="2"/>
  <text x="250" y="478" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32">多数派 2/3 → 选出唯一主、继续服务</text>
  <circle cx="670" cy="420" r="40" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/>
  <text x="670" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">etcd-3</text>
  <text x="670" y="436" text-anchor="middle" font-size="11" fill="#5B6B7B">拒绝读写</text>
  <text x="670" y="478" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">少数派 1/3 → 凑不齐 2 票，自动失效</text>
  <text x="450" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">✓ 全局唯一主</text>
</svg>
