<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" height="auto" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">设计图的右半边：失效分支通常是空白的</title>
  <desc id="d">同一个状态写入动作分成两支。左支是 Redis 正常时的路径，写入成功、呼叫继续，边框为实线绿色，表示设计文档已经定义。右支是 Redis 分片不可用时的路径，边框为虚线红色，内容只有三个未定的问号选项：拒绝新呼叫、本地降级继续、挂起等恢复。说明失效分支尚未定义，设计未完成。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA7B4"/>
    </marker>
    <marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="450" fill="#FFFFFF"/>
  <text x="30" y="34" text-anchor="start" font-size="16" font-weight="700" fill="#1E3A5F">一次呼叫状态写入，两支路径</text>
  <rect x="280" y="50" width="200" height="46" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.2"/>
  <text x="380.0" y="78.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">呼叫状态写入</text>
  <path d="M 360 96 L 190 136" fill="none" stroke="#9AA7B4" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M 400 96 L 570 136" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#ar-bad)"/>
  <rect x="70" y="138" width="240" height="46" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.2"/>
  <text x="190.0" y="166.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Redis 正常</text>
  <path d="M 190 184 L 190 224" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="70" y="226" width="240" height="46" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.2"/>
  <text x="190.0" y="254.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">写状态，呼叫继续</text>
  <text x="190" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">文档里画得清清楚楚的那一半</text>
  <rect x="450" y="138" width="240" height="46" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2.2"/>
  <text x="570.0" y="166.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Redis 分片不可用</text>
  <path d="M 570 184 L 570 224" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#ar-bad)" stroke-dasharray="7 5"/>
  <rect x="450" y="226" width="240" height="118" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="570" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#C62828">？</text>
  <text x="478" y="282" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">拒绝新呼叫？</text>
  <text x="478" y="306" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">本地降级继续？</text>
  <text x="478" y="330" text-anchor="start" font-size="13" font-weight="400" fill="#5B6B7B">挂起等恢复？</text>
  <text x="570" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#C62828">评审该花时间的那一半</text>
  <line x1="30" y1="400" x2="730" y2="400" stroke="#9AA7B4" stroke-width="1"/>
  <text x="380" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">右半边空着，这个设计就还没写完</text>
</svg>
