<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" height="auto" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">状态归属：三家都能写 对比 单一 owner</title>
  <desc id="d">上半部分：呼叫服务、转接服务、清理任务三个组件各自直接写同一份呼叫状态，三条写入箭头为红色，标注为危险。下半部分：呼叫服务是唯一写入方，呼叫状态向下通过读、事件、API 三种只读方式分别提供给转接服务、计费和监控。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA7B4"/>
    </marker>
    <marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#FFFFFF"/>
  <text x="30" y="36" text-anchor="start" font-size="16" font-weight="700" fill="#C62828">三家都能写同一份状态</text>
  <text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#5B6B7B">评审时看到这种图，基本可以预定一个分布式 bug</text>
  <rect x="55" y="76" width="160" height="44" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2.2"/>
  <text x="135.0" y="103.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">呼叫服务</text>
  <rect x="300" y="76" width="160" height="44" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2.2"/>
  <text x="380.0" y="103.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">转接服务</text>
  <rect x="545" y="76" width="160" height="44" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2.2"/>
  <text x="625.0" y="103.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">清理任务</text>
  <path d="M 135 120 L 330 186" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#ar-bad)"/>
  <path d="M 380 120 L 380 186" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#ar-bad)"/>
  <path d="M 625 120 L 430 186" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#ar-bad)"/>
  <text x="200" y="152" text-anchor="start" font-size="13" font-weight="700" fill="#C62828">写</text>
  <text x="390" y="152" text-anchor="start" font-size="13" font-weight="700" fill="#C62828">写</text>
  <text x="545" y="152" text-anchor="start" font-size="13" font-weight="700" fill="#C62828">写</text>
  <rect x="280" y="188" width="200" height="46" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="2.2"/>
  <text x="380.0" y="216.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">呼叫状态</text>
  <line x1="30" y1="266" x2="730" y2="266" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30" y="300" text-anchor="start" font-size="16" font-weight="700" fill="#2E7D32">单一 owner，其余只读</text>
  <text x="30" y="322" text-anchor="start" font-size="12" font-weight="400" fill="#5B6B7B">改文档的成本是几页纸，上线后再改的成本是一次迁移</text>
  <rect x="40" y="344" width="180" height="52" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.2"/>
  <text x="130.0" y="369.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">呼叫服务</text>
  <text x="130.0" y="388.0" text-anchor="middle" font-size="12" fill="#5B6B7B">唯一写入方</text>
  <rect x="300" y="344" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.2"/>
  <text x="400.0" y="375.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">呼叫状态</text>
  <path d="M 220 370 L 298 370" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="259" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">写</text>
  <path d="M 360 396 L 150 462" fill="none" stroke="#9AA7B4" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M 400 396 L 400 462" fill="none" stroke="#9AA7B4" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M 440 396 L 640 462" fill="none" stroke="#9AA7B4" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="225" y="430" text-anchor="start" font-size="12" font-weight="700" fill="#1565C0">读</text>
  <text x="410" y="430" text-anchor="start" font-size="12" font-weight="700" fill="#1565C0">事件</text>
  <text x="545" y="430" text-anchor="start" font-size="12" font-weight="700" fill="#1565C0">API</text>
  <rect x="70" y="464" width="160" height="44" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.2"/>
  <text x="150.0" y="491.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">转接服务</text>
  <rect x="320" y="464" width="160" height="44" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.2"/>
  <text x="400.0" y="491.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">计费</text>
  <rect x="560" y="464" width="160" height="44" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.2"/>
  <text x="640.0" y="491.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">监控</text>
  <text x="380" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">问一句：这份状态谁拥有？谁被允许改？</text>
</svg>
