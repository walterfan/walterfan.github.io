<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 385" role="img"
     aria-labelledby="title description">
  <title id="title">CRC16 的异或线性原理</title>
  <desc id="description">CRC16/XMODEM 在 GF(2) 上线性：翻动一个比特对槽号的影响固定且可异或叠加，凑目标槽变成线性方程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3.5; marker-end: url(#arrow); }
    .back  { fill: none; stroke: #dc2626; stroke-width: 3.5; marker-end: url(#arrow);
              stroke-dasharray: 10 7; }
    .label { fill: #0f172a; font-size: 24px; font-weight: 650; }
    .big   { fill: #0f172a; font-size: 30px; font-weight: 700; }
    .small { fill: #475569; font-size: 19px; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
  <rect width="940" height="385" rx="24" fill="#ffffff"/>
  <text x="470" y="46" text-anchor="middle" class="big">CRC(A &#8853; B) = CRC(A) &#8853; CRC(B)</text>
  <text x="470" y="80" text-anchor="middle" class="small">XMODEM 初值 0、无末异或，所以没有偏置常数 C（C=0）</text>
  <rect x="60" y="120" width="360" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="240" y="155" text-anchor="middle" class="label">在 tag 里翻动 1 个比特</text>
  <text x="90" y="200" class="small mono">@@@@</text>
  <text x="240" y="200" text-anchor="middle" class="small">slot = 13881</text>
  <text x="90" y="245" class="small mono">@@@A</text>
  <text x="240" y="245" text-anchor="middle" class="small">slot = 13881 &#8853; &#916;</text>
  <text x="90" y="295" class="small">每个比特的 &#916; 固定、独立、可叠加</text>
  <path class="arrow" d="M430 220 H505"/>
  <rect x="515" y="120" width="365" height="200" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="3"/>
  <text x="697" y="155" text-anchor="middle" class="label">凑目标槽 = 选哪几个 &#916; 异或</text>
  <text x="697" y="205" text-anchor="middle" class="small">slot = 13881 &#8853; &#916;&#8321; &#8853; &#916;&#8323; &#8853; &#916;&#8327; ...</text>
  <text x="697" y="255" text-anchor="middle" class="small">这是一道线性方程</text>
  <text x="697" y="290" text-anchor="middle" class="small">高斯消元直接解，不用碰撞</text>
  <text x="470" y="355" text-anchor="middle" class="small">mod 16384 = &amp; 0x3FFF = 砍掉高 2 位，也是线性映射，不破坏上式</text>

</svg>
