<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img"
     aria-labelledby="title description">
  <title id="title">O(1) 构造 tag 的三步流水线</title>
  <desc id="description">算偏移、查两张128项小表异或、把16位mask每4位映射成一个字符，拼出命中目标槽的tag。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3.5; marker-end: url(#arrow); }
    .back  { fill: none; stroke: #dc2626; stroke-width: 3.5; marker-end: url(#arrow);
              stroke-dasharray: 10 7; }
    .label { fill: #0f172a; font-size: 24px; font-weight: 650; }
    .big   { fill: #0f172a; font-size: 30px; font-weight: 700; }
    .small { fill: #475569; font-size: 19px; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
  <rect width="940" height="350" rx="24" fill="#ffffff"/>
  <text x="470" y="42" text-anchor="middle" class="small">给定 slot，三步出 tag，全是位运算和查表，无循环</text>
  <rect x="40" y="80" width="260" height="150" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="170" y="120" text-anchor="middle" class="label">①算偏移</text>
  <text x="170" y="160" text-anchor="middle" class="mono small">delta = slot &#8853; 13881</text>
  <text x="170" y="200" text-anchor="middle" class="small">锚点 @@@@ 的槽号 13881 当零点</text>
  <path class="arrow" d="M300 155 H340"/>
  <rect x="340" y="80" width="260" height="150" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="470" y="120" text-anchor="middle" class="label">②查两表</text>
  <text x="470" y="160" text-anchor="middle" class="mono small">mask = low[delta%128]</text>
  <text x="470" y="200" text-anchor="middle" class="small">&#8853; high[delta/128]，两张 128 项小表</text>
  <path class="arrow" d="M600 155 H640"/>
  <rect x="640" y="80" width="260" height="150" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="770" y="120" text-anchor="middle" class="label">③拼字符</text>
  <text x="770" y="160" text-anchor="middle" class="mono small">每 4 位 &#8594; 一个字符下标</text>
  <text x="770" y="200" text-anchor="middle" class="small">查 @ABC…O，拼出 4 字符 tag</text>
  <text x="470" y="290" text-anchor="middle" class="small">例：slot 0 &#8594; delta=13881 &#8594; mask &#8594; tag "DLH@" &#8594; Key = ms_health:{DLH@}:write</text>
  <text x="470" y="325" text-anchor="middle" class="small">启动时建两张表（256 个整数，塞进 L1 缓存），此后每次构造都是常数时间</text>

</svg>
