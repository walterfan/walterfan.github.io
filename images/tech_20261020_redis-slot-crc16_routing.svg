<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img"
     aria-labelledby="title description">
  <title id="title">Redis 槽的正向路由与反向构造</title>
  <desc id="description">黑实线表示 Redis 把 Key 经 CRC16 映射到槽号；红虚线表示反向需求：给定槽号构造命中它的 Key。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3.5; marker-end: url(#arrow); }
    .back  { fill: none; stroke: #dc2626; stroke-width: 3.5; marker-end: url(#arrow);
              stroke-dasharray: 10 7; }
    .label { fill: #0f172a; font-size: 24px; font-weight: 650; }
    .big   { fill: #0f172a; font-size: 30px; font-weight: 700; }
    .small { fill: #475569; font-size: 19px; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
  <rect width="940" height="360" rx="24" fill="#ffffff"/>
  <text x="470" y="46" text-anchor="middle" class="small">Redis 正常流向（黑实线）：给 Key 算槽号</text>
  <rect x="45" y="75" width="250" height="80" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="170" y="110" text-anchor="middle" class="label">Key</text>
  <text x="170" y="138" text-anchor="middle" class="small mono">ms_health:{DLH@}:write</text>
  <rect x="370" y="75" width="200" height="80" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="470" y="112" text-anchor="middle" class="label">CRC16</text>
  <text x="470" y="138" text-anchor="middle" class="small">XMODEM % 16384</text>
  <rect x="645" y="75" width="250" height="80" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="770" y="112" text-anchor="middle" class="label">Slot</text>
  <text x="770" y="138" text-anchor="middle" class="small">0 ~ 16383</text>
  <path class="arrow" d="M295 115 H365"/>
  <path class="arrow" d="M570 115 H640"/>
  <text x="470" y="215" text-anchor="middle" class="small" fill="#dc2626">我们要的反向（红虚线）：给槽号造 Key</text>
  <path class="back" d="M770 165 C770 250 470 250 300 215"/>
  <path class="back" d="M470 240 C320 240 200 200 200 165"/>
  <text x="470" y="290" text-anchor="middle" class="big">碰撞法：平均试 16384 次才中一个指定槽</text>
  <text x="470" y="325" text-anchor="middle" class="small">本文：两次查表 + 一次异或，O(1) 确定命中</text>

</svg>
