<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 405" role="img"
     aria-labelledby="title description">
  <title id="title">hash tag 的结构：4 字符 16 个自由位</title>
  <desc id="description">4 个字符各取自 @ABC..O，高 4 位固定为 0100，低 4 位自由，共 16 个自由比特覆盖 14 位槽空间。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3.5; marker-end: url(#arrow); }
    .back  { fill: none; stroke: #dc2626; stroke-width: 3.5; marker-end: url(#arrow);
              stroke-dasharray: 10 7; }
    .label { fill: #0f172a; font-size: 24px; font-weight: 650; }
    .big   { fill: #0f172a; font-size: 30px; font-weight: 700; }
    .small { fill: #475569; font-size: 19px; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
  <rect width="940" height="405" rx="24" fill="#ffffff"/>
  <text x="470" y="44" text-anchor="middle" class="small">4 个字符，每个取自 @ABC…O（0x40~0x4F），只有低 4 位在变</text>
  <rect x="90" y="80" width="160" height="170" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="170" y="120" text-anchor="middle" class="small">字符 1</text>
  <text x="170" y="165" text-anchor="middle" class="mono" font-size="34">0100</text>
  <text x="170" y="215" text-anchor="middle" class="mono" font-size="34" fill="#dc2626">????</text>
  <text x="170" y="245" text-anchor="middle" class="small">高4位固定 / 低4位自由</text>
  <rect x="290" y="80" width="160" height="170" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="370" y="120" text-anchor="middle" class="small">字符 2</text>
  <text x="370" y="165" text-anchor="middle" class="mono" font-size="34">0100</text>
  <text x="370" y="215" text-anchor="middle" class="mono" font-size="34" fill="#dc2626">????</text>
  <text x="370" y="245" text-anchor="middle" class="small">高4位固定 / 低4位自由</text>
  <rect x="490" y="80" width="160" height="170" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="570" y="120" text-anchor="middle" class="small">字符 3</text>
  <text x="570" y="165" text-anchor="middle" class="mono" font-size="34">0100</text>
  <text x="570" y="215" text-anchor="middle" class="mono" font-size="34" fill="#dc2626">????</text>
  <text x="570" y="245" text-anchor="middle" class="small">高4位固定 / 低4位自由</text>
  <rect x="690" y="80" width="160" height="170" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="770" y="120" text-anchor="middle" class="small">字符 4</text>
  <text x="770" y="165" text-anchor="middle" class="mono" font-size="34">0100</text>
  <text x="770" y="215" text-anchor="middle" class="mono" font-size="34" fill="#dc2626">????</text>
  <text x="770" y="245" text-anchor="middle" class="small">高4位固定 / 低4位自由</text>
  <text x="470" y="300" text-anchor="middle" class="big">4 字符 &#215; 4 自由位 = 16 个自由位</text>
  <text x="470" y="338" text-anchor="middle" class="small">要覆盖 14 位槽号（0~16383），自由度足够；16 个基向量秩满 14 → 全 16384 槽可达</text>
  <text x="470" y="378" text-anchor="middle" class="small">巧合：字符低 4 位的值，正好等于它在 @ABC…O 里的下标 → 最后拼字符零成本</text>

</svg>
