<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img"
     aria-labelledby="cov-title cov-desc">
  <title id="cov-title">三主各管一段 slot，16384 个槽全部有人覆盖</title>
  <desc id="cov-desc">一条从 0 到 16383 的 slot 条带被均分成三段，分别由主节点 A、B、C 认领，三段首尾相接、没有空隙，表示 16384 个 slot 全部被活着的节点覆盖，集群状态为 ok。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { fill: #475569; font-size: 20px; }
    .label { fill: #0f172a; font-size: 26px; font-weight: 700; }
    .range { fill: #334155; font-size: 18px; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    .ok    { fill: #16a34a; font-size: 24px; font-weight: 700; }
    .tick  { fill: #64748b; font-size: 16px; }
  </style>
  <rect width="940" height="320" rx="24" fill="#ffffff"/>
  <text x="470" y="48" text-anchor="middle" class="title">16384 个 slot 被三个主节点完整覆盖</text>

  <!-- segment A -->
  <rect x="60" y="90" width="270" height="90" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="195" y="128" text-anchor="middle" class="label">Master A</text>
  <text x="195" y="158" text-anchor="middle" class="range mono">slots 0 - 5460</text>

  <!-- segment B -->
  <rect x="335" y="90" width="270" height="90" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="470" y="128" text-anchor="middle" class="label">Master B</text>
  <text x="470" y="158" text-anchor="middle" class="range mono">slots 5461 - 10922</text>

  <!-- segment C -->
  <rect x="610" y="90" width="270" height="90" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/>
  <text x="745" y="128" text-anchor="middle" class="label">Master C</text>
  <text x="745" y="158" text-anchor="middle" class="range mono">slots 10923 - 16383</text>

  <!-- axis ticks -->
  <line x1="60" y1="200" x2="880" y2="200" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60"  y="226" text-anchor="middle" class="tick mono">0</text>
  <text x="335" y="226" text-anchor="middle" class="tick mono">5461</text>
  <text x="610" y="226" text-anchor="middle" class="tick mono">10923</text>
  <text x="880" y="226" text-anchor="middle" class="tick mono">16383</text>

  <text x="470" y="285" text-anchor="middle" class="ok">16384 / 16384 覆盖 → cluster_state: ok</text>
</svg>
