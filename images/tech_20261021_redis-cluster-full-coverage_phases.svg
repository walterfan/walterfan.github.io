<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"
     aria-labelledby="ph-title ph-desc">
  <title id="ph-title">master 挂掉后的三个阶段：正常 → 短暂 FAIL → failover 后恢复</title>
  <desc id="ph-desc">三栏并列。阶段一正常，A、B、C 三段 slot 都有人管，集群 ok。阶段二主节点 B 挂掉，它负责的 5461-10922 段暂时没人管，集群状态变为 fail。阶段三副本 B1 完成 failover 升为新主并接管该段 slot，覆盖恢复，集群状态回到 ok。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .phase { fill: #0f172a; font-size: 20px; font-weight: 700; }
    .node  { fill: #0f172a; font-size: 18px; font-weight: 650; }
    .rng   { fill: #475569; font-size: 13px; }
    .mono  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    .ok    { fill: #16a34a; font-size: 17px; font-weight: 700; }
    .fail  { fill: #dc2626; font-size: 17px; font-weight: 700; }
    .flow  { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#ar); }
    .note  { fill: #64748b; font-size: 13px; }
  </style>
  <rect width="960" height="440" rx="24" fill="#ffffff"/>

  <!-- ===== Phase 1 ===== -->
  <text x="155" y="48" text-anchor="middle" class="phase">阶段一：正常</text>
  <g>
    <rect x="40" y="70"  width="230" height="46" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="70" y="99" class="node">A</text><text x="120" y="98" class="rng mono">slots 0-5460</text>
    <rect x="40" y="130" width="230" height="46" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2.5"/>
    <text x="70" y="159" class="node">B</text><text x="120" y="158" class="rng mono">slots 5461-10922</text>
    <rect x="40" y="190" width="230" height="46" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="70" y="219" class="node">C</text><text x="120" y="218" class="rng mono">slots 10923-16383</text>
  </g>
  <text x="155" y="275" text-anchor="middle" class="ok">16384/16384 → ok</text>

  <!-- ===== Phase 2 ===== -->
  <text x="480" y="48" text-anchor="middle" class="phase">阶段二：B 挂，副本未上</text>
  <g>
    <rect x="365" y="70"  width="230" height="46" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="395" y="99" class="node">A</text><text x="445" y="98" class="rng mono">slots 0-5460</text>
    <rect x="365" y="130" width="230" height="46" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="395" y="159" class="fail">B ✗</text><text x="455" y="158" class="rng mono">无人管</text>
    <rect x="365" y="190" width="230" height="46" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="395" y="219" class="node">C</text><text x="445" y="218" class="rng mono">slots 10923-16383</text>
  </g>
  <text x="480" y="275" text-anchor="middle" class="fail">5461-10922 uncovered → fail</text>

  <!-- ===== Phase 3 ===== -->
  <text x="805" y="48" text-anchor="middle" class="phase">阶段三：B1 failover</text>
  <g>
    <rect x="690" y="70"  width="230" height="46" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="720" y="99" class="node">A</text><text x="770" y="98" class="rng mono">slots 0-5460</text>
    <rect x="690" y="130" width="230" height="46" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2.5"/>
    <text x="720" y="159" class="node">B1</text><text x="770" y="158" class="rng mono">slots 5461-10922</text>
    <rect x="690" y="190" width="230" height="46" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="720" y="219" class="node">C</text><text x="770" y="218" class="rng mono">slots 10923-16383</text>
  </g>
  <text x="805" y="275" text-anchor="middle" class="ok">覆盖恢复 → ok</text>

  <!-- flow arrows between phases -->
  <line x1="285" y1="153" x2="350" y2="153" class="flow"/>
  <line x1="610" y1="153" x2="675" y2="153" class="flow"/>

  <!-- bottom note -->
  <line x1="40" y1="320" x2="920" y2="320" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="358" text-anchor="middle" class="note">补回 slot 覆盖的是副本 failover（阶段二 → 阶段三），不是 cluster-require-full-coverage。</text>
  <text x="480" y="384" text-anchor="middle" class="note">该配置只在 failover 失败、阶段二持续不散时，决定集群是停摆（yes）还是降级服务（no）。</text>
</svg>
